name = "telegram-relay"
main = "src/index.js"
compatibility_date = "2026-08-08"

# ┌──────────────────────────────────────────────┐
# │  敏感变量请在 Cloudflare Dashboard 中配置：     │
# │  Settings → Variables and Secrets             │
# │                                               │
# │  需要添加的变量：                               │
# │    BOT_TOKEN  (类型选 Secret)                  │
# │    CHAT_ID    (类型选 Secret)                  │
# │    AUTH_KEY   (类型选 Secret，可选)             │
# └──────────────────────────────────────────────┘


[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
